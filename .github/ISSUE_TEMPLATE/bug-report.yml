name: Bug report
description: Something on the site is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: e.g. https://paintdex.app/paints/citadel-abaddon-black
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome 126 on macOS, Safari on iOS 18, etc.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
