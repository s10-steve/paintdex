name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:data
      - run: npm run test
      - run: npm run build
      # The whole security model is client-side libraries plus Postgres RLS, so
      # a known-vulnerable dependency is a first-order concern rather than a
      # background chore. High and above only, to keep this actionable.
      - run: npm audit --audit-level=high
